<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>אודי סיפורים</title>
<meta name="description" content="סיפורים קצרים מאת אודי. קריאה וחיפוש.">
<meta property="og:title" content="אודי סיפורים">
<meta property="og:description" content="סיפורים קצרים מאת אודי. קריאה וחיפוש.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://avtushh.github.io/udi-stories/">
<meta property="og:image" content="https://avtushh.github.io/udi-stories/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button type="button" class="top-back" id="top-back" hidden aria-label="חזרה לספרייה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="logo" id="logo" type="button">אודי סיפורים</button>
  <form class="search" id="search-form">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="חיפוש לפי מילה או שם" autocomplete="off">
  </form>
  <nav class="nav">
    <button type="button" data-go="home" class="nav-btn on">הספרייה</button>
    <button type="button" data-go="map" class="nav-btn">נושאים ותגיות</button>
    <button type="button" class="nav-btn" id="auth" hidden>התחברות</button>
    <button type="button" class="nav-btn" id="add-open" hidden>+ הוספת סיפור</button>
    <button type="button" class="nav-btn" id="logout" hidden>התנתקות</button>
  </nav>
</header>
<dialog id="login" class="login-pop">
  <form id="login-form">
    <h2>התחברות</h2>
    <label for="login-email">מייל</label>
    <input id="login-email" type="email" required autocomplete="email">
    <p>אם המייל מורשה, יישלח אליו קישור חד-פעמי. הקישור נפתח במחשב שבו רץ האתר.</p>
    <div class="row-actions">
      <button class="orange-btn" type="submit">שליחת קישור</button>
      <button type="button" class="nav-btn" id="login-close">סגור</button>
    </div>
    <p class="msg" id="login-msg"></p>
  </form>
</dialog>
<dialog id="add-pop" class="login-pop add-pop">
  <button type="button" class="pop-x" id="add-close" aria-label="סגור">×</button>
  <form id="add">
    <h2 id="add-title">סיפור חדש</h2>
    <label for="file">קובץ וורד</label>
    <input id="file" type="file" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
    <label for="title">כותרת</label>
    <input id="title" type="text" required>
    <label for="when">תאריך כתיבה</label>
    <input id="when" type="date">
    <label for="theme">קטגוריה</label>
    <select id="theme" required></select>
    <label for="synopsis">תקציר, אם רוצים. אפשר להשאיר ריק.</label>
    <textarea id="synopsis"></textarea>
    <label for="text">הסיפור</label>
    <textarea id="text" required></textarea>
    <div class="row-actions">
      <button class="orange-btn" id="add-save" type="submit">שמירה לספרייה</button>
      <button class="nav-btn" id="add-delete" type="button" hidden>מחיקה</button>
      <span id="save-msg"></span>
    </div>
  </form>
</dialog>
<main id="app"></main>
<footer class="site-foot">
  <nav class="site-foot-links" aria-label="קישורים">
    <a href="#/legal">זכויות יוצרים ותנאי שימוש</a>
  </nav>
  <p class="site-foot-legal">© 2026 אודי גבריאלי. כל הזכויות שמורות.</p>
  <p class="site-credit">האתר נוצר על ידי אבנר גבריאלי</p>
</footer>
<script src="data/stories.js"></script>
<script src="data/added.js"></script>
<script src="app.js"></script>
</body>
</html>
